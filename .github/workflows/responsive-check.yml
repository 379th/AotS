name: Responsive Design Check

on:
  push:
    branches: [ main, Workapp-01 ]
    paths:
      - 'frontend/src/**/*.tsx'
      - 'frontend/src/**/*.ts'
  pull_request:
    branches: [ main, Workapp-01 ]
    paths:
      - 'frontend/src/**/*.tsx'
      - 'frontend/src/**/*.ts'

jobs:
  responsive-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run responsive check
      working-directory: ./frontend
      run: npm run check:responsive
      
    - name: Upload responsive report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: responsive-report
        path: frontend/responsive-report.txt
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './frontend/responsive-report.txt';
          
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 Отчет о проверке адаптивности\n\n\`\`\`\n${report}\n\`\`\``
            });
          }
