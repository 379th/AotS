# Railway Deployment Configuration
# Автоматическая проверка адаптивности перед деплоем

version: '1.0'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.railway
    environment:
      - NODE_ENV=production
      - VITE_APP_ENV=production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Сервис для проверки адаптивности
  responsive-checker:
    build:
      context: ./frontend
      dockerfile: Dockerfile.checker
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src:ro
      - ./responsive-reports:/app/reports
    command: ["npm", "run", "check:responsive"]
    depends_on:
      - frontend
